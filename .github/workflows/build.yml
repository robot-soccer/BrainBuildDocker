name: Build Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      btcpp_version:
        description: 'BehaviorTree.CPP version'
        required: false
        default: '4.6.2'
      rerun_version:
        description: 'Rerun SDK version'
        required: false
        default: '0.19.0'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/brain-build

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value={{branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BTCPP_VERSION=${{ github.event.inputs.btcpp_version || '4.6.2' }}
            RERUN_VERSION=${{ github.event.inputs.rerun_version || '0.19.0' }}

      - name: Make package public
        if: github.event_name != 'pull_request'
        run: |
          curl -s -X PATCH \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/brain-build" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"visibility":"public"}' \
            -w "\nHTTP %{http_code}\n"
